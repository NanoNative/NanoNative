name: 📦 CD · Publish Central

on:
  workflow_call:
    inputs:
      run_id:
        description: Build run.
        required: false
        default: ''
        type: string
    secrets:
      CENTRAL_USER:
        required: true
      CENTRAL_PASS:
        required: true
      GPG_SIGNING_KEY:
        required: true
      GPG_PASSPHRASE:
        required: true

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      deployments: write
    environment:
      name: maven-central
      url: https://central.sonatype.com
    steps:
      - name: "🔐 Check Publish Secrets"
        shell: sh
        env:
          CENTRAL_USER: ${{ secrets.CENTRAL_USER }}
          CENTRAL_PASS: ${{ secrets.CENTRAL_PASS }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -eu
          : "${CENTRAL_USER:?Missing required secret: CENTRAL_USER}"
          : "${CENTRAL_PASS:?Missing required secret: CENTRAL_PASS}"
          : "${GPG_SIGNING_KEY:?Missing required secret: GPG_SIGNING_KEY}"
          : "${GPG_PASSPHRASE:?Missing required secret: GPG_PASSPHRASE}"

      - name: "📥 Download Build Artifact"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: build-workspace
          path: ${{ github.workspace }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id || github.run_id }}

      - name: "🔧 Restore Maven Wrapper"
        shell: sh
        run: chmod +x "${GITHUB_WORKSPACE}/mvnw"

      - name: "🔍 Read Java Info"
        id: java_info
        uses: YunaBraska/java-info-action@11a434ffbf6bb3357363d1933be71a4076a90a6b # v3

      - name: "☕ Setup Java [${{ steps.java_info.outputs.java_version }}]"
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ steps.java_info.outputs.java_version }}
          cache: maven
          server-id: central
          server-username: CENTRAL_USER
          server-password: CENTRAL_PASS
          gpg-private-key: ${{ secrets.GPG_SIGNING_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
        env:
          CENTRAL_USER: ${{ secrets.CENTRAL_USER }}
          CENTRAL_PASS: ${{ secrets.CENTRAL_PASS }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: "🔐 Configure Maven Central"
        shell: sh
        run: |
          set -eu
          # Maven 3.10 scopes credentials to known repository origins.
          sed "/<id>central<\\/id>/a\\
                <repositoryOrigins>\\
                  <repositoryOrigin>https://central.sonatype.com</repositoryOrigin>\\
                </repositoryOrigins>" "${HOME}/.m2/settings.xml" > "${HOME}/.m2/settings.xml.tmp"
          mv "${HOME}/.m2/settings.xml.tmp" "${HOME}/.m2/settings.xml"

      - name: "Setup Maven [3.9.16]"
        shell: sh
        run: |
          set -eu
          archive="${RUNNER_TEMP}/apache-maven-3.9.16-bin.tar.gz"
          curl --fail --location --silent --show-error \
            'https://dlcdn.apache.org/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz' \
            --output "${archive}"
          printf '%s  %s\n' \
            '831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6' \
            "${archive}" | sha512sum --check --status
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/apache-maven-3.9.16/bin/mvn" --version

      - name: "🚀 Maven Central"
        env:
          CENTRAL_USER: ${{ secrets.CENTRAL_USER }}
          CENTRAL_PASS: ${{ secrets.CENTRAL_PASS }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        shell: sh
        run: |
          set -eu
          case "${{ steps.java_info.outputs.project_version }}" in
            *-SNAPSHOT)
              "${RUNNER_TEMP}/apache-maven-3.9.16/bin/mvn" -B -Pcentral -DskipTests -DcentralSnapshotsUrl=https://central.sonatype.com/repository/maven-snapshots/ deploy
              exit 0
              ;;
          esac
          # Maven 3.10 writes maven-metadata-local.xml into Central's staging directory.
          # central-publishing-maven-plugin 0.11.0 then submits that invalid bundle.
          "${RUNNER_TEMP}/apache-maven-3.9.16/bin/mvn" -B -Pcentral -DskipTests deploy

name: 🤖 CD · Weekly Maintenance

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run.
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: weekly-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.BOT_TOKEN }}
    steps:
      - name: "☕ Setup Java [25]"
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          server-id: github
          server-username-env-var: GITHUB_ACTOR
          server-password-env-var: GH_TOKEN

      - name: "🤖 Merge"
        shell: sh
        run: |
          set -eu
          dry_run="${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}"
          repositories_file="${RUNNER_TEMP}/repositories.tsv"
          failures=0

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "BOT_TOKEN is not configured; weekly maintenance is disabled."
            exit 0
          fi

          gh repo list "${GITHUB_REPOSITORY_OWNER}" --limit 1000 --json nameWithOwner,isArchived,isFork,defaultBranchRef \
            --jq '.[] | select(.isArchived == false and .isFork == false and .defaultBranchRef != null) | [.nameWithOwner, .defaultBranchRef.name] | @tsv' \
            > "${repositories_file}"

          merge_ready_prs() {
            repository=$1
            base_branch=$2
            prs=$(gh pr list --repo "${repository}" --base "${base_branch}" --state open --json number,headRefName,headRefOid,isDraft \
              --jq '.[] | select(.isDraft == false) | select(.headRefName | test("^(dependabot/|bot/maintenance-)")) | [.number, .headRefName, .headRefOid] | @tsv')
            while IFS="$(printf '\t')" read -r pr branch commit_sha; do
              if [ -z "${pr}" ]; then
                continue
              fi
              if ! gh api --silent "repos/${repository}/actions/workflows/build-pr.yml" >/dev/null 2>&1; then
                echo "${repository}#${pr} has no standard build-pr.yml; leaving it open."
                continue
              fi
              build_check=$(gh run list --repo "${repository}" --workflow build-pr.yml --commit "${commit_sha}" --status completed --limit 20 --json conclusion --jq 'if length == 0 then "missing" elif any(.[]; .conclusion == "success") then "success" else "failed" end')
              if [ "${build_check}" != 'success' ]; then
                if [ "${build_check}" = 'missing' ]; then
                  if [ "${dry_run}" = 'true' ]; then
                    echo "Would start the normal PR build for ${repository}#${pr}."
                  elif gh workflow run build-pr.yml --repo "${repository}" --ref "${branch}" >/dev/null 2>&1; then
                    echo "Started the normal PR build for ${repository}#${pr}."
                  else
                    echo "${repository}#${pr} has no startable normal PR build at its current commit; leaving it open."
                  fi
                else
                  echo "${repository}#${pr} has no successful normal PR build; leaving it open."
                fi
                continue
              fi
              if [ "${dry_run}" = "true" ]; then
                echo "Would merge ${repository}#${pr}."
              elif gh pr merge "${pr}" --repo "${repository}" --squash --delete-branch --admin >/dev/null 2>&1; then
                echo "Merged ${repository}#${pr}."
              else
                state=$(gh pr view "${pr}" --repo "${repository}" --json state,mergeStateStatus --jq '.state + ":" + .mergeStateStatus')
                case "${state}" in
                  OPEN:BEHIND|OPEN:BLOCKED|OPEN:DIRTY|OPEN:UNSTABLE|OPEN:UNKNOWN)
                    echo "${repository}#${pr} is not ready to merge; leaving it open."
                    ;;
                  *)
                    echo "Could not merge ${repository}#${pr}." >&2
                    failures=$((failures + 1))
                    ;;
                esac
              fi
            done <<EOF
          ${prs}
          EOF
          }

          maintain_upstream() {
            repository=$1
            default_branch=$2
            upstream_repository=$3
            branch='bot/maintenance-upstream'
            checkout=$(mktemp -d "${RUNNER_TEMP}/maintenance.XXXXXX")

            if gh pr list --repo "${repository}" --head "${branch}" --state open --json number --jq '.[0].number // empty' | grep -q .; then
              echo "${repository}: ${branch} already has an open pull request."
              rm -rf "${checkout}"
              return
            fi

            git clone --quiet --depth=1 --branch "${default_branch}" "https://x-access-token:${GH_TOKEN}@github.com/${repository}.git" "${checkout}"
            (
              cd "${checkout}"
              ./mvnw -B verify
            )

            if git -C "${checkout}" diff --quiet; then
              echo "${repository}: ${upstream_repository} is current."
              rm -rf "${checkout}"
              return
            fi
            if [ "${dry_run}" = "true" ]; then
              echo "Would open ${repository}:${branch}."
              rm -rf "${checkout}"
              return
            fi

            git -C "${checkout}" switch -c "${branch}"
            git -C "${checkout}" config user.name 'Kira Bot'
            git -C "${checkout}" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "${checkout}" diff --name-only | while IFS= read -r path; do
              git -C "${checkout}" add -- "${path}"
            done
            git -C "${checkout}" commit -m 'build: update upstream sources'
            git -C "${checkout}" push origin "${branch}"
            gh pr create --repo "${repository}" --base "${default_branch}" --head "${branch}" --title 'build: update upstream sources' --body "Updates ${upstream_repository}."
            rm -rf "${checkout}"
          }

          while IFS="$(printf '\t')" read -r repository default_branch; do
            merge_ready_prs "${repository}" "${default_branch}"

            if ! workflow_paths=$(gh api "repos/${repository}/contents/.github/workflows?ref=${default_branch}" --jq '.[] | select(.type == "file") | select((.name | endswith(".yml")) or (.name | endswith(".yaml"))) | .path' 2>/dev/null); then
              continue
            fi
            upstream_repository=''
            upstream_markers=0
            for workflow_path in ${workflow_paths}; do
              workflow_file="${RUNNER_TEMP}/workflow.yml"
              if ! gh api -H 'Accept: application/vnd.github.raw+json' "repos/${repository}/contents/${workflow_path}?ref=${default_branch}" > "${workflow_file}" 2>/dev/null; then
                continue
              fi
              marker=$(sed -nE 's/^[[:space:]]*# nanonative-java-upstream:[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' "${workflow_file}")
              if [ -z "${marker}" ]; then
                continue
              fi
              upstream_markers=$((upstream_markers + 1))
              upstream_repository="${marker}"
            done
            if [ "${upstream_markers}" -eq 1 ]; then
              maintain_upstream "${repository}" "${default_branch}" "${upstream_repository}"
            elif [ "${upstream_markers}" -gt 1 ]; then
              echo "${repository}: multiple nanonative-java-upstream markers; skipping."
            fi
          done < "${repositories_file}"

          test "${failures}" -eq 0
